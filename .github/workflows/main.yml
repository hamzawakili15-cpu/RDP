name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Configure Remote Desktop
      # ==========================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          # Set RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove old firewall rule if it exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP port
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."

      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + `
                         [char[]](58..64) + `
                         [char[]](91..96) + `
                         [char[]](123..126))
          }

          # Generate password
          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove existing RDP user if present
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          # Create user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          # Add administrator privileges
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Add Remote Desktop permission
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Verify user creation
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed."
              exit 1
          }

          # Save credentials for later steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."

      # ==========================================
      # 3. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          # Correct Windows Temp path
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Write-Host "Installer path: $installerPath"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer was not downloaded."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed with exit code $($process.ExitCode)"
              exit 1
          }

          Write-Host "Tailscale installed successfully."

          # Clean up installer
          Remove-Item `
            -Path $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

      # ==========================================
      # 4. Connect Tailscale
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          # Correct Tailscale executable path
          $tailscaleExe = Join-Path `
            $env:ProgramFiles `
            "Tailscale\tailscale.exe"

          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          # Connect to Tailscale
          & $tailscaleExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale failed to connect."
              exit 1
          }

          Write-Host "Tailscale connected."

          # Wait for Tailscale IPv4 address
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              Write-Host "Checking Tailscale IP... attempt $i/20"

              $tsIP = (& $tailscaleExe ip -4 2>$null).Trim()

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          # Save IP for next steps
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ==========================================
      # 5. Verify RDP
      # ==========================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          Write-Host "================================"
          Write-Host "RDP Connectivity Test"
          Write-Host "================================"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # Test local RDP service
          $rdpService = Get-Service -Name TermService

          Write-Host "RDP Service Status: $($rdpService.Status)"

          if ($rdpService.Status -ne "Running") {
              Write-Error "Remote Desktop service is not running."
              exit 1
          }

          # Test port 3389
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "TCP connectivity successful!"
          Write-Host "RDP port 3389 is accessible."

      # ==========================================
      # 6. Keep Runner Alive
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP ACCESS INFORMATION"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP is ready."
          Write-Host "=========================================="
          Write-Host ""

          # Keep GitHub runner alive
          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active..."

              Start-Sleep -Seconds 300
          }
